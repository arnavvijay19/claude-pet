<!doctype html>
<html>
<head><meta charset="utf-8"><title>Claude Pet Response</title><link rel="stylesheet" href="response.css"></head>
<body>
<main>
  <header><strong id="title">Claude Pet</strong><span id="permission-header" class="permission-badge">No permission profile</span></header>
  <p id="summary">Ready for an Offline Demo goal.</p>
  <section id="simple-panel">
    <p id="permission-simple" class="permission-badge">No permission profile</p>
    <dl><dt>Phase</dt><dd id="phase">ready</dd><dt>Executor</dt><dd id="executor">offline-demo</dd><dt>Model</dt><dd id="model">offline-demo</dd><dt>Workspace</dt><dd id="workspace">No workspace selected</dd><dt>Elapsed</dt><dd id="elapsed">0s</dd></dl>
    <p id="changed"></p>
  </section>
  <section id="comprehensive-panel" hidden>
    <p id="permission-comprehensive" class="permission-badge">No permission profile</p>
    <ol id="events"></ol>
  </section>
  <div><button id="simple">Simple</button><button id="comprehensive">Comprehensive</button><button id="stop">Stop</button><button id="settings">Settings</button></div>
</main>
<script src="responseViewModel.js"></script><script src="response.js"></script>
</body>
</html>
