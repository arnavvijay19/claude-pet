<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Claude Pet Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <h1>Claude Pet Settings</h1>
  <p>Choose Offline Demo or a native Codex / Claude Code agent. Real providers default to warned Full Computer access.</p>
  <p id="active-permission" class="permission-badge">No connection selected</p>
  <label>Agent
    <select id="executor">
      <option value="offline-demo">Offline Demo</option>
      <option value="codex-cli">Codex</option>
      <option value="claude-code-cli">Claude Code</option>
    </select>
  </label>
  <label>Workspace <input id="workspace" placeholder="C:\\workspace"></label>
  <label id="permission-row" hidden>Permission <select id="permission-profile"></select></label>
  <p id="mode-help" class="mode-help"></p>
  <label id="model-row" hidden>Model <select id="model"></select></label>
  <label id="effort-row" hidden>Effort <select id="effort"></select></label>
  <div class="actions">
    <button id="save">Save connection</button>
    <button id="test">Test connection</button>
    <button id="setup">Sign in to agent</button>
  </div>
  <p id="status" role="status"></p>
  <section>
    <h2>Connections</h2>
    <ul id="connections"></ul>
  </section>
</main>
<script src="settingsStatus.js"></script>
<script src="settingsPresentation.js"></script>
<script src="settings.js"></script>
</body>
</html>
